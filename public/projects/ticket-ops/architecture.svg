<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b8cc4"/>
    </marker>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16284a"/><stop offset="1" stop-color="#11203c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="740" fill="#0b1220"/>

  <text x="60" y="56" fill="#eaf0fa" font-size="30" font-weight="700">Ticket Ops Suite — System Architecture</text>
  <text x="60" y="84" fill="#93a4c3" font-size="16">Four surfaces — chat console, availability poller, browser extension, desktop agent — around one shared spreadsheet.</text>

  <!-- external target band -->
  <rect x="60" y="112" width="1080" height="76" rx="12" fill="url(#band)" stroke="#2b3f66"/>
  <text x="84" y="144" fill="#e3b341" font-size="17" font-weight="700">External ticketing platform (the target)</text>
  <text x="84" y="168" fill="#aebcd2" font-size="14">Angular SPA · undocumented JSON API · session-scoped ids · per-language inventory · captcha · third-party bank gateway</text>

  <!-- ============ ROW 1 : CONTROL PLANE ============ -->
  <text x="60" y="212" fill="#6b8cc4" font-size="12" font-weight="700" letter-spacing="1.6">1 · CONTROL PLANE</text>

  <rect x="60" y="224" width="290" height="120" rx="12" fill="#15213a" stroke="#2b3f66"/>
  <text x="80" y="254" fill="#eaf0fa" font-size="16" font-weight="700">Operator chat groups</text>
  <text x="80" y="280" fill="#93a4c3" font-size="13">One group per client. Add / list /</text>
  <text x="80" y="300" fill="#93a4c3" font-size="13">remove monitors, status, kill switch.</text>
  <text x="80" y="326" fill="#6b8cc4" font-size="12">No web form. No dashboard to host.</text>

  <rect x="420" y="224" width="290" height="120" rx="12" fill="#15213a" stroke="#2b3f66"/>
  <text x="440" y="254" fill="#eaf0fa" font-size="16" font-weight="700">Monitor service</text>
  <text x="440" y="280" fill="#93a4c3" font-size="13">Python · inline-keyboard wizard,</text>
  <text x="440" y="300" fill="#93a4c3" font-size="13">calendar picker, export / import.</text>
  <text x="440" y="326" fill="#6b8cc4" font-size="12">Stays up even when watching is off.</text>

  <rect x="780" y="224" width="290" height="120" rx="12" fill="#15213a" stroke="#2b3f66"/>
  <text x="800" y="254" fill="#eaf0fa" font-size="16" font-weight="700">Shared spreadsheet</text>
  <text x="800" y="280" fill="#93a4c3" font-size="13">Tabs: active monitors · per-group</text>
  <text x="800" y="300" fill="#93a4c3" font-size="13">settings · legacy history.</text>
  <text x="800" y="326" fill="#6b8cc4" font-size="12">The only shared state. No database.</text>

  <line x1="350" y1="284" x2="418" y2="284" stroke="#6b8cc4" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="710" y1="284" x2="778" y2="284" stroke="#6b8cc4" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="925" y1="344" x2="925" y2="392" stroke="#6b8cc4" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ============ ROW 2 : WATCH & NOTIFY ============ -->
  <text x="60" y="382" fill="#6b8cc4" font-size="12" font-weight="700" letter-spacing="1.6">2 · WATCH &amp; NOTIFY</text>

  <rect x="780" y="394" width="290" height="120" rx="12" fill="#15213a" stroke="#2b3f66"/>
  <circle cx="800" cy="418" r="4" fill="#e3b341"/>
  <text x="814" y="423" fill="#e3b341" font-size="12" font-weight="700">calls the target API</text>
  <text x="800" y="450" fill="#eaf0fa" font-size="16" font-weight="700">Availability poller</text>
  <text x="800" y="476" fill="#93a4c3" font-size="13">Node · 5s tick · one monitor per</text>
  <text x="800" y="496" fill="#93a4c3" font-size="13">pass · party step-down · dedupe.</text>

  <rect x="420" y="394" width="290" height="120" rx="12" fill="#15213a" stroke="#2b3f66"/>
  <text x="440" y="424" fill="#eaf0fa" font-size="16" font-weight="700">Alert composer + shortener</text>
  <text x="440" y="450" fill="#93a4c3" font-size="13">Encodes the whole booking into a</text>
  <text x="440" y="470" fill="#93a4c3" font-size="13">deep link, then mints a short code</text>
  <text x="440" y="490" fill="#93a4c3" font-size="13">so the chat client opens it silently.</text>

  <rect x="60" y="394" width="290" height="120" rx="12" fill="#15213a" stroke="#2b3f66"/>
  <text x="80" y="424" fill="#eaf0fa" font-size="16" font-weight="700">Alert lands in the group</text>
  <text x="80" y="450" fill="#93a4c3" font-size="13">Slot times, party size, ticket mix —</text>
  <text x="80" y="470" fill="#93a4c3" font-size="13">one tappable link per bookable slot.</text>
  <text x="80" y="496" fill="#6b8cc4" font-size="12">Routed back to the owning group only.</text>

  <line x1="778" y1="454" x2="712" y2="454" stroke="#6b8cc4" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="418" y1="454" x2="352" y2="454" stroke="#6b8cc4" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="205" y1="514" x2="205" y2="562" stroke="#6b8cc4" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ============ ROW 3 : ACT ============ -->
  <text x="60" y="552" fill="#6b8cc4" font-size="12" font-weight="700" letter-spacing="1.6">3 · ACT</text>

  <rect x="60" y="564" width="290" height="120" rx="12" fill="#15213a" stroke="#2b3f66"/>
  <text x="80" y="594" fill="#eaf0fa" font-size="16" font-weight="700">Desktop agent (away mode)</text>
  <text x="80" y="620" fill="#93a4c3" font-size="13">Electron on Windows · polls the</text>
  <text x="80" y="640" fill="#93a4c3" font-size="13">link feed · opens each booking in</text>
  <text x="80" y="660" fill="#93a4c3" font-size="13">the user's own browser profile.</text>

  <rect x="420" y="564" width="290" height="120" rx="12" fill="#15213a" stroke="#2b3f66"/>
  <circle cx="440" cy="588" r="4" fill="#e3b341"/>
  <text x="454" y="593" fill="#e3b341" font-size="12" font-weight="700">drives the target UI</text>
  <text x="440" y="620" fill="#eaf0fa" font-size="16" font-weight="700">Browser extension</text>
  <text x="440" y="646" fill="#93a4c3" font-size="13">Decodes the link, picks the visit and</text>
  <text x="440" y="666" fill="#93a4c3" font-size="13">slot, fills checkout, isolates carts.</text>

  <rect x="780" y="564" width="290" height="120" rx="12" fill="#15213a" stroke="#3fb950"/>
  <text x="800" y="594" fill="#3fb950" font-size="16" font-weight="700">Human takes over</text>
  <text x="800" y="620" fill="#93a4c3" font-size="13">Captcha and card payment are</text>
  <text x="800" y="640" fill="#93a4c3" font-size="13">never automated. The page is left</text>
  <text x="800" y="660" fill="#93a4c3" font-size="13">parked, filled in, waiting.</text>

  <line x1="350" y1="624" x2="418" y2="624" stroke="#6b8cc4" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="710" y1="624" x2="778" y2="624" stroke="#6b8cc4" stroke-width="2" marker-end="url(#arr)"/>

  <text x="60" y="716" fill="#6b8cc4" font-size="13">Two long-lived services, one spreadsheet, zero servers to log into day-to-day — the whole operation is driven from chat.</text>
</svg>
