<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="vps" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12203a"/><stop offset="1" stop-color="#0e1a30"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="640" fill="#0b1220"/>

  <text x="60" y="52" fill="#eaf0fa" font-size="30" font-weight="700">Boring on purpose: one box, two units, one script</text>
  <text x="60" y="80" fill="#93a4c3" font-size="16">No orchestrator, no queue, no database. Everything that can be re-run safely, is.</text>

  <!-- ============ VPS ============ -->
  <rect x="60" y="126" width="700" height="404" rx="14" fill="url(#vps)" stroke="#2b3f66"/>
  <text x="84" y="158" fill="#6b8cc4" font-size="11" font-weight="700" letter-spacing="1.4">A SINGLE SMALL VPS</text>

  <rect x="90" y="176" width="310" height="104" rx="10" fill="#15213a" stroke="#3fb950"/>
  <rect x="106" y="192" width="70" height="19" rx="9" fill="#1e3326" stroke="#3fb950"/>
  <text x="141" y="205" text-anchor="middle" fill="#8fe0a6" font-size="10.5" font-weight="700">always on</text>
  <text x="106" y="234" fill="#eaf0fa" font-size="14.5" font-weight="700">Monitor service</text>
  <text x="106" y="256" fill="#93a4c3" font-size="12">The only process that receives commands —</text>
  <text x="106" y="272" fill="#93a4c3" font-size="12">it must never be the thing you stop.</text>

  <rect x="420" y="176" width="310" height="104" rx="10" fill="#15213a" stroke="#e3b341"/>
  <rect x="436" y="192" width="98" height="19" rx="9" fill="#2b2718" stroke="#e3b341"/>
  <text x="485" y="205" text-anchor="middle" fill="#e3b341" font-size="10.5" font-weight="700">stop / start-able</text>
  <text x="436" y="234" fill="#eaf0fa" font-size="14.5" font-weight="700">Availability service</text>
  <text x="436" y="256" fill="#93a4c3" font-size="12">Polls, alerts, serves links. Stopped and</text>
  <text x="436" y="272" fill="#93a4c3" font-size="12">started on demand, from chat.</text>

  <rect x="90" y="300" width="640" height="88" rx="10" fill="#15213a" stroke="#2b3f66"/>
  <text x="106" y="330" fill="#eaf0fa" font-size="14.5" font-weight="700">Reverse proxy + auto-renewed TLS</text>
  <text x="106" y="354" fill="#93a4c3" font-size="12">Fronts four tiny endpoints: the short-link redirect, a health check, the away-mode link feed,</text>
  <text x="106" y="372" fill="#93a4c3" font-size="12">and the extension's access check. That is the entire public surface area.</text>

  <rect x="90" y="408" width="310" height="98" rx="10" fill="#15213a" stroke="#2b3f66"/>
  <text x="106" y="438" fill="#eaf0fa" font-size="14.5" font-weight="700">Two secret files</text>
  <text x="106" y="462" fill="#93a4c3" font-size="12">One environment file and one service-account</text>
  <text x="106" y="480" fill="#93a4c3" font-size="12">key, shared by both units. Neither is in the</text>
  <text x="106" y="498" fill="#93a4c3" font-size="12">repository, and neither is baked into a build.</text>

  <rect x="420" y="408" width="310" height="98" rx="10" fill="#15213a" stroke="#2b3f66"/>
  <text x="436" y="438" fill="#eaf0fa" font-size="14.5" font-weight="700">Two disposable state files</text>
  <text x="436" y="462" fill="#93a4c3" font-size="12">What has already been announced, and the</text>
  <text x="436" y="480" fill="#93a4c3" font-size="12">short-code map. Delete either and the worst</text>
  <text x="436" y="498" fill="#93a4c3" font-size="12">case is one repeated alert.</text>

  <!-- ============ OPS NOTES ============ -->
  <rect x="790" y="126" width="350" height="98" rx="12" fill="#15213a" stroke="#2b3f66"/>
  <text x="814" y="156" fill="#eaf0fa" font-size="14.5" font-weight="700">One idempotent installer</text>
  <text x="814" y="180" fill="#93a4c3" font-size="11.5">Runtimes, both units, the proxy, the certificate</text>
  <text x="814" y="197" fill="#93a4c3" font-size="11.5">and a health check — in a single command.</text>
  <text x="814" y="214" fill="#93a4c3" font-size="11.5">Re-running it is also how you deploy an update.</text>

  <rect x="790" y="240" width="350" height="98" rx="12" fill="#15213a" stroke="#2b3f66"/>
  <text x="814" y="270" fill="#eaf0fa" font-size="14.5" font-weight="700">A kill switch that lives in chat</text>
  <text x="814" y="294" fill="#93a4c3" font-size="11.5">Pausing stops the watcher through a narrowly</text>
  <text x="814" y="311" fill="#93a4c3" font-size="11.5">scoped privileged helper and leaves a flag, so</text>
  <text x="814" y="328" fill="#93a4c3" font-size="11.5">even a manual restart comes back paused.</text>

  <rect x="790" y="354" width="350" height="98" rx="12" fill="#15213a" stroke="#2b3f66"/>
  <text x="814" y="384" fill="#eaf0fa" font-size="14.5" font-weight="700">Restricted to one room</text>
  <text x="814" y="408" fill="#93a4c3" font-size="11.5">Only a nominated control chat may pause or</text>
  <text x="814" y="425" fill="#93a4c3" font-size="11.5">resume, and client groups only ever see the</text>
  <text x="814" y="442" fill="#93a4c3" font-size="11.5">monitors and alerts that belong to them.</text>

  <rect x="790" y="468" width="350" height="62" rx="12" fill="#15213a" stroke="#2b3f66"/>
  <text x="814" y="496" fill="#eaf0fa" font-size="14.5" font-weight="700">Failure modes, written down</text>
  <text x="814" y="518" fill="#93a4c3" font-size="11.5">A symptom-to-cause table ships with the repo.</text>

  <text x="60" y="588" fill="#6b8cc4" font-size="13">The design rule throughout: the surface that receives commands and the surface that does the work are never the same process.</text>
</svg>
