<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="cpBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16284a"/><stop offset="1" stop-color="#11203c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="690" fill="#0b1220"/>

  <text x="60" y="52" fill="#eaf0fa" font-size="30" font-weight="700">The whole console is a chat window</text>
  <text x="60" y="80" fill="#93a4c3" font-size="16">A seven-step inline wizard replaces the admin panel we deliberately never built.</text>

  <!-- step rail -->
  <g font-size="13">
    <rect x="60"   y="106" width="138" height="44" rx="10" fill="url(#cpBand)" stroke="#2b3f66"/>
    <text x="129"  y="126" text-anchor="middle" fill="#6b8cc4" font-size="11" font-weight="700">STEP 1</text>
    <text x="129"  y="143" text-anchor="middle" fill="#eaf0fa">Ticket type</text>

    <rect x="214"  y="106" width="138" height="44" rx="10" fill="url(#cpBand)" stroke="#2b3f66"/>
    <text x="283"  y="126" text-anchor="middle" fill="#6b8cc4" font-size="11" font-weight="700">STEP 2</text>
    <text x="283"  y="143" text-anchor="middle" fill="#eaf0fa">Date mode</text>

    <rect x="368"  y="106" width="138" height="44" rx="10" fill="url(#cpBand)" stroke="#e3b341"/>
    <text x="437"  y="126" text-anchor="middle" fill="#e3b341" font-size="11" font-weight="700">STEP 3</text>
    <text x="437"  y="143" text-anchor="middle" fill="#eaf0fa">Calendar</text>

    <rect x="522"  y="106" width="138" height="44" rx="10" fill="url(#cpBand)" stroke="#2b3f66"/>
    <text x="591"  y="126" text-anchor="middle" fill="#6b8cc4" font-size="11" font-weight="700">STEP 4</text>
    <text x="591"  y="143" text-anchor="middle" fill="#eaf0fa">Adults</text>

    <rect x="676"  y="106" width="138" height="44" rx="10" fill="url(#cpBand)" stroke="#2b3f66"/>
    <text x="745"  y="126" text-anchor="middle" fill="#6b8cc4" font-size="11" font-weight="700">STEP 5</text>
    <text x="745"  y="143" text-anchor="middle" fill="#eaf0fa">Children</text>

    <rect x="830"  y="106" width="138" height="44" rx="10" fill="url(#cpBand)" stroke="#2b3f66"/>
    <text x="899"  y="126" text-anchor="middle" fill="#6b8cc4" font-size="11" font-weight="700">STEP 6</text>
    <text x="899"  y="143" text-anchor="middle" fill="#eaf0fa">Preferred times</text>

    <rect x="984"  y="106" width="138" height="44" rx="10" fill="url(#cpBand)" stroke="#3fb950"/>
    <text x="1053" y="126" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="700">STEP 7</text>
    <text x="1053" y="143" text-anchor="middle" fill="#eaf0fa">Confirm</text>
  </g>

  <!-- ================= LEFT: wizard ================= -->
  <rect x="60" y="186" width="520" height="440" rx="14" fill="#15213a" stroke="#2b3f66"/>
  <rect x="60" y="186" width="520" height="38" rx="14" fill="#16284a"/>
  <rect x="60" y="210" width="520" height="14" fill="#16284a"/>
  <line x1="60" y1="224" x2="580" y2="224" stroke="#2b3f66"/>
  <circle cx="82" cy="205" r="7" fill="#2b3f66"/>
  <text x="98" y="210" fill="#eaf0fa" font-size="13" font-weight="600">Client group · monitor wizard</text>

  <text x="84" y="252" fill="#93a4c3" font-size="12">Pick the start date — tap again to close a range.</text>

  <!-- month header -->
  <rect x="84" y="264" width="470" height="30" rx="8" fill="#11203c" stroke="#2b3f66"/>
  <text x="106" y="284" fill="#6b8cc4" font-size="14" font-weight="700">‹</text>
  <text x="319" y="284" text-anchor="middle" fill="#eaf0fa" font-size="13" font-weight="600">September 2026</text>
  <text x="530" y="284" fill="#6b8cc4" font-size="14" font-weight="700">›</text>

  <!-- weekday header -->
  <g font-size="11" fill="#6b8cc4" text-anchor="middle" font-weight="700">
    <text x="115" y="316">Mo</text><text x="183" y="316">Tu</text><text x="251" y="316">We</text>
    <text x="319" y="316">Th</text><text x="387" y="316">Fr</text><text x="455" y="316">Sa</text>
    <text x="523" y="316">Su</text>
  </g>

  <!-- calendar cells: 5 rows -->
  <g>
    <!-- row 1: 1..7 -->
    <rect x="84"  y="326" width="62" height="30" rx="7" fill="#11203c" stroke="#243456"/><text x="115" y="346" text-anchor="middle" fill="#4a5a78" font-size="12">1</text>
    <rect x="152" y="326" width="62" height="30" rx="7" fill="#11203c" stroke="#243456"/><text x="183" y="346" text-anchor="middle" fill="#4a5a78" font-size="12">2</text>
    <rect x="220" y="326" width="62" height="30" rx="7" fill="#11203c" stroke="#243456"/><text x="251" y="346" text-anchor="middle" fill="#4a5a78" font-size="12">3</text>
    <rect x="288" y="326" width="62" height="30" rx="7" fill="#11203c" stroke="#243456"/><text x="319" y="346" text-anchor="middle" fill="#4a5a78" font-size="12">4</text>
    <rect x="356" y="326" width="62" height="30" rx="7" fill="#11203c" stroke="#243456"/><text x="387" y="346" text-anchor="middle" fill="#4a5a78" font-size="12">5</text>
    <rect x="424" y="326" width="62" height="30" rx="7" fill="#11203c" stroke="#243456"/><text x="455" y="346" text-anchor="middle" fill="#4a5a78" font-size="12">6</text>
    <rect x="492" y="326" width="62" height="30" rx="7" fill="#11203c" stroke="#243456"/><text x="523" y="346" text-anchor="middle" fill="#4a5a78" font-size="12">7</text>

    <!-- row 2: 8..14 -->
    <rect x="84"  y="362" width="62" height="30" rx="7" fill="#1a2947" stroke="#2b3f66"/><text x="115" y="382" text-anchor="middle" fill="#c9d6ea" font-size="12">8</text>
    <rect x="152" y="362" width="62" height="30" rx="7" fill="#1a2947" stroke="#2b3f66"/><text x="183" y="382" text-anchor="middle" fill="#c9d6ea" font-size="12">9</text>
    <rect x="220" y="362" width="62" height="30" rx="7" fill="#1a2947" stroke="#2b3f66"/><text x="251" y="382" text-anchor="middle" fill="#c9d6ea" font-size="12">10</text>
    <rect x="288" y="362" width="62" height="30" rx="7" fill="#1a2947" stroke="#2b3f66"/><text x="319" y="382" text-anchor="middle" fill="#c9d6ea" font-size="12">11</text>
    <rect x="356" y="362" width="62" height="30" rx="7" fill="#e3b341" stroke="#e3b341"/><text x="387" y="382" text-anchor="middle" fill="#11203c" font-size="12" font-weight="700">12</text>
    <rect x="424" y="362" width="62" height="30" rx="7" fill="#2a3f2e" stroke="#3fb950"/><text x="455" y="382" text-anchor="middle" fill="#8fe0a6" font-size="12">13</text>
    <rect x="492" y="362" width="62" height="30" rx="7" fill="#2a3f2e" stroke="#3fb950"/><text x="523" y="382" text-anchor="middle" fill="#8fe0a6" font-size="12">14</text>

    <!-- row 3: 15..21 -->
    <rect x="84"  y="398" width="62" height="30" rx="7" fill="#2a3f2e" stroke="#3fb950"/><text x="115" y="418" text-anchor="middle" fill="#8fe0a6" font-size="12">15</text>
    <rect x="152" y="398" width="62" height="30" rx="7" fill="#2a3f2e" stroke="#3fb950"/><text x="183" y="418" text-anchor="middle" fill="#8fe0a6" font-size="12">16</text>
    <rect x="220" y="398" width="62" height="30" rx="7" fill="#2a3f2e" stroke="#3fb950"/><text x="251" y="418" text-anchor="middle" fill="#8fe0a6" font-size="12">17</text>
    <rect x="288" y="398" width="62" height="30" rx="7" fill="#2a3f2e" stroke="#3fb950"/><text x="319" y="418" text-anchor="middle" fill="#8fe0a6" font-size="12">18</text>
    <rect x="356" y="398" width="62" height="30" rx="7" fill="#2a3f2e" stroke="#3fb950"/><text x="387" y="418" text-anchor="middle" fill="#8fe0a6" font-size="12">19</text>
    <rect x="424" y="398" width="62" height="30" rx="7" fill="#e3b341" stroke="#e3b341"/><text x="455" y="418" text-anchor="middle" fill="#11203c" font-size="12" font-weight="700">20</text>
    <rect x="492" y="398" width="62" height="30" rx="7" fill="#1a2947" stroke="#2b3f66"/><text x="523" y="418" text-anchor="middle" fill="#c9d6ea" font-size="12">21</text>

    <!-- row 4: 22..28 -->
    <rect x="84"  y="434" width="62" height="30" rx="7" fill="#1a2947" stroke="#2b3f66"/><text x="115" y="454" text-anchor="middle" fill="#c9d6ea" font-size="12">22</text>
    <rect x="152" y="434" width="62" height="30" rx="7" fill="#1a2947" stroke="#2b3f66"/><text x="183" y="454" text-anchor="middle" fill="#c9d6ea" font-size="12">23</text>
    <rect x="220" y="434" width="62" height="30" rx="7" fill="#1a2947" stroke="#2b3f66"/><text x="251" y="454" text-anchor="middle" fill="#c9d6ea" font-size="12">24</text>
    <rect x="288" y="434" width="62" height="30" rx="7" fill="#1a2947" stroke="#2b3f66"/><text x="319" y="454" text-anchor="middle" fill="#c9d6ea" font-size="12">25</text>
    <rect x="356" y="434" width="62" height="30" rx="7" fill="#1a2947" stroke="#2b3f66"/><text x="387" y="454" text-anchor="middle" fill="#c9d6ea" font-size="12">26</text>
    <rect x="424" y="434" width="62" height="30" rx="7" fill="#1a2947" stroke="#2b3f66"/><text x="455" y="454" text-anchor="middle" fill="#c9d6ea" font-size="12">27</text>
    <rect x="492" y="434" width="62" height="30" rx="7" fill="#1a2947" stroke="#2b3f66"/><text x="523" y="454" text-anchor="middle" fill="#c9d6ea" font-size="12">28</text>
  </g>

  <text x="84" y="490" fill="#6b8cc4" font-size="12">Gold = range ends · green = days covered · grey = already past</text>

  <!-- reply keyboard -->
  <line x1="60" y1="508" x2="580" y2="508" stroke="#2b3f66"/>
  <g font-size="12">
    <rect x="84"  y="524" width="150" height="34" rx="8" fill="#11203c" stroke="#2b3f66"/><text x="159" y="546" text-anchor="middle" fill="#c9d6ea">+ Add Monitor</text>
    <rect x="244" y="524" width="150" height="34" rx="8" fill="#11203c" stroke="#2b3f66"/><text x="319" y="546" text-anchor="middle" fill="#c9d6ea">List Monitors</text>
    <rect x="404" y="524" width="150" height="34" rx="8" fill="#11203c" stroke="#2b3f66"/><text x="479" y="546" text-anchor="middle" fill="#c9d6ea">Remove Monitor</text>

    <rect x="84"  y="566" width="230" height="34" rx="8" fill="#11203c" stroke="#2b3f66"/><text x="199" y="588" text-anchor="middle" fill="#c9d6ea">Status</text>
    <rect x="324" y="566" width="230" height="34" rx="8" fill="#1e3326" stroke="#3fb950"/><text x="439" y="588" text-anchor="middle" fill="#8fe0a6">Work ON — tap to pause</text>
  </g>

  <!-- ================= RIGHT: results ================= -->
  <rect x="620" y="186" width="520" height="440" rx="14" fill="#15213a" stroke="#2b3f66"/>
  <rect x="620" y="186" width="520" height="38" rx="14" fill="#16284a"/>
  <rect x="620" y="210" width="520" height="14" fill="#16284a"/>
  <line x1="620" y1="224" x2="1140" y2="224" stroke="#2b3f66"/>
  <circle cx="642" cy="205" r="7" fill="#2b3f66"/>
  <text x="658" y="210" fill="#eaf0fa" font-size="13" font-weight="600">What the group actually sees</text>

  <!-- monitor card -->
  <text x="644" y="252" fill="#6b8cc4" font-size="11" font-weight="700" letter-spacing="1.2">A SAVED MONITOR</text>
  <rect x="644" y="262" width="472" height="132" rx="10" fill="#11203c" stroke="#2b3f66"/>
  <text x="666" y="290" fill="#eaf0fa" font-size="14" font-weight="700">#1 · Admission</text>
  <text x="666" y="314" fill="#93a4c3" font-size="13">12 – 20 Sep 2026 · range</text>
  <text x="666" y="336" fill="#93a4c3" font-size="13">2 adults + 1 child · 3 visitors</text>
  <text x="666" y="358" fill="#93a4c3" font-size="13">Times: 09:00, 09:30, 14:00 (±30m)</text>
  <rect x="666" y="368" width="86" height="20" rx="10" fill="#1e3326" stroke="#3fb950"/>
  <text x="709" y="382" text-anchor="middle" fill="#8fe0a6" font-size="11" font-weight="700">watching</text>
  <text x="768" y="382" fill="#6b8cc4" font-size="11">until removed from chat</text>

  <!-- alert -->
  <text x="644" y="428" fill="#e3b341" font-size="11" font-weight="700" letter-spacing="1.2">THE ALERT, SECONDS LATER</text>
  <rect x="644" y="438" width="472" height="160" rx="10" fill="#11203c" stroke="#e3b341"/>
  <text x="666" y="466" fill="#eaf0fa" font-size="14" font-weight="700">Availability found</text>
  <text x="666" y="490" fill="#93a4c3" font-size="13">Admission · Sat 13 Sep · 2 Adults, 1 Child</text>
  <line x1="666" y1="502" x2="1094" y2="502" stroke="#2b3f66"/>
  <text x="666" y="524" fill="#c9d6ea" font-size="13">09:00 →</text>
  <text x="742" y="524" fill="#6b8cc4" font-size="13">short link</text>
  <text x="666" y="546" fill="#c9d6ea" font-size="13">09:30 →</text>
  <text x="742" y="546" fill="#6b8cc4" font-size="13">short link</text>
  <text x="666" y="568" fill="#c9d6ea" font-size="13">14:00 →</text>
  <text x="742" y="568" fill="#6b8cc4" font-size="13">short link</text>
  <text x="666" y="590" fill="#93a4c3" font-size="11">One link per bookable slot — each opens with no confirmation prompt.</text>

  <text x="60" y="662" fill="#6b8cc4" font-size="13">Every operator action — create, inspect, remove, pause the whole fleet — happens in the same thread the alerts arrive in.</text>
</svg>
