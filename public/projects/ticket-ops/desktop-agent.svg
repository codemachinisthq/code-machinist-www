<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <rect width="1200" height="690" fill="#0b1220"/>

  <text x="60" y="52" fill="#eaf0fa" font-size="30" font-weight="700">Away mode: one button, then walk away</text>
  <text x="60" y="80" fill="#93a4c3" font-size="16">A packaged Windows agent for the non-technical end of the operation — no config, no chat, no terminal.</text>

  <!-- ================= APP WINDOW ================= -->
  <rect x="60" y="126" width="620" height="494" rx="14" fill="#15213a" stroke="#2b3f66"/>
  <rect x="60" y="126" width="620" height="40" rx="14" fill="#16284a"/>
  <rect x="60" y="152" width="620" height="14" fill="#16284a"/>
  <line x1="60" y1="166" x2="680" y2="166" stroke="#2b3f66"/>
  <circle cx="84" cy="146" r="5.5" fill="#f85149" opacity="0.7"/>
  <circle cx="102" cy="146" r="5.5" fill="#e3b341" opacity="0.7"/>
  <circle cx="120" cy="146" r="5.5" fill="#3fb950" opacity="0.7"/>
  <text x="142" y="151" fill="#eaf0fa" font-size="13" font-weight="600">Ticket Agent</text>
  <text x="656" y="151" text-anchor="end" fill="#6b8cc4" font-size="11">tray · start with Windows</text>

  <!-- hero -->
  <rect x="84" y="190" width="572" height="110" rx="12" fill="#11203c" stroke="#3fb950"/>
  <circle cx="118" cy="228" r="7" fill="#3fb950"/>
  <text x="136" y="234" fill="#3fb950" font-size="17" font-weight="700">Monitoring active</text>
  <text x="108" y="264" fill="#93a4c3" font-size="12.5">Watching for new booking links and opening each one in your browser.</text>
  <text x="108" y="285" fill="#93a4c3" font-size="12.5">Finish the captcha and the payment yourself when you get back.</text>
  <rect x="486" y="212" width="146" height="42" rx="10" fill="#2a1c1c" stroke="#f85149"/>
  <text x="559" y="238" text-anchor="middle" fill="#f0857f" font-size="13.5" font-weight="700">Stop Monitoring</text>

  <!-- tiles -->
  <rect x="84"  y="320" width="180" height="76" rx="10" fill="#11203c" stroke="#2b3f66"/>
  <text x="174" y="348" text-anchor="middle" fill="#eaf0fa" font-size="22" font-weight="700">3 / 5</text>
  <text x="174" y="374" text-anchor="middle" fill="#6b8cc4" font-size="11.5">opened this session</text>

  <rect x="280" y="320" width="180" height="76" rx="10" fill="#11203c" stroke="#2b3f66"/>
  <text x="370" y="348" text-anchor="middle" fill="#eaf0fa" font-size="22" font-weight="700">8 s</text>
  <text x="370" y="374" text-anchor="middle" fill="#6b8cc4" font-size="11.5">feed poll interval</text>

  <rect x="476" y="320" width="180" height="76" rx="10" fill="#11203c" stroke="#2b3f66"/>
  <text x="566" y="348" text-anchor="middle" fill="#eaf0fa" font-size="22" font-weight="700">2</text>
  <text x="566" y="374" text-anchor="middle" fill="#6b8cc4" font-size="11.5">queued, waiting on you</text>

  <!-- log -->
  <rect x="84" y="414" width="572" height="170" rx="10" fill="#0d1728" stroke="#2b3f66"/>
  <text x="104" y="440" fill="#6b8cc4" font-size="10.5" font-weight="700" letter-spacing="1.2">ACTIVITY</text>
  <g font-family="Consolas, ui-monospace, monospace" font-size="11.5">
    <text x="104" y="466" fill="#8fe0a6">20:14:02  Monitoring started — feed → your browser</text>
    <text x="104" y="488" fill="#93a4c3">20:14:10  Queued booking link</text>
    <text x="104" y="510" fill="#93a4c3">20:14:10  Opening next booking (1/5, 0 waiting)…</text>
    <text x="104" y="532" fill="#93a4c3">20:14:12  Browser opened — assistant is driving the page</text>
    <text x="104" y="554" fill="#6b8cc4">20:15:41  Skipped (already opened)</text>
    <text x="104" y="576" fill="#e3b341">20:16:03  Waiting: opened 5/5 this session, 2 still queued</text>
  </g>

  <text x="84" y="608" fill="#6b8cc4" font-size="11.5">Settings, event log and the opened-link ledger live in the user's own app-data folder.</text>

  <!-- ================= NOTES ================= -->
  <rect x="720" y="126" width="420" height="110" rx="12" fill="#15213a" stroke="#2b3f66"/>
  <text x="744" y="158" fill="#eaf0fa" font-size="15" font-weight="700">Poll, never listen</text>
  <text x="744" y="184" fill="#93a4c3" font-size="12">The agent asks the server for recent booking links on a</text>
  <text x="744" y="203" fill="#93a4c3" font-size="12">timer. No inbound port, no account, no network setup on</text>
  <text x="744" y="222" fill="#93a4c3" font-size="12">a machine we will never get to debug in person.</text>

  <rect x="720" y="254" width="420" height="110" rx="12" fill="#15213a" stroke="#2b3f66"/>
  <text x="744" y="286" fill="#eaf0fa" font-size="15" font-weight="700">Open each link exactly once</text>
  <text x="744" y="312" fill="#93a4c3" font-size="12">A durable ledger of link codes, written before the window</text>
  <text x="744" y="331" fill="#93a4c3" font-size="12">opens — so a crash, a restart or a repeated alert can</text>
  <text x="744" y="350" fill="#93a4c3" font-size="12">never produce the same booking twice.</text>

  <rect x="720" y="382" width="420" height="110" rx="12" fill="#15213a" stroke="#2b3f66"/>
  <text x="744" y="414" fill="#eaf0fa" font-size="15" font-weight="700">Back-pressure, not a flood</text>
  <text x="744" y="440" fill="#93a4c3" font-size="12">A cap on how many bookings may be open at once. Past</text>
  <text x="744" y="459" fill="#93a4c3" font-size="12">the cap the rest queue and wait, so someone coming</text>
  <text x="744" y="478" fill="#93a4c3" font-size="12">back to the desk finds a handful of tabs, not eighty.</text>

  <rect x="720" y="510" width="420" height="110" rx="12" fill="#15213a" stroke="#e3b341"/>
  <text x="744" y="542" fill="#e3b341" font-size="15" font-weight="700">Their browser, not a clean one</text>
  <text x="744" y="568" fill="#93a4c3" font-size="12">An automation-driven browser starts with no extension and</text>
  <text x="744" y="587" fill="#93a4c3" font-size="12">no profile. The agent launches the one already installed —</text>
  <text x="744" y="606" fill="#93a4c3" font-size="12">the only place the assistant actually lives.</text>

  <text x="60" y="662" fill="#6b8cc4" font-size="13">Shipped as one Windows installer that also carries the extension build — client setup is install, load the add-on once, press Start.</text>
</svg>
