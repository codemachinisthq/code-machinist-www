<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="iR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f85149"/>
    </marker>
    <marker id="iG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3fb950"/>
    </marker>
  </defs>

  <rect width="1200" height="620" fill="#0b1220"/>

  <text x="60" y="52" fill="#eaf0fa" font-size="30" font-weight="700">Two bookings at once — the bug that isn't in your code</text>
  <text x="60" y="80" fill="#93a4c3" font-size="16">The cart lives on the server, keyed by a cookie. Cookies are shared by every tab. So two tabs are one cart.</text>

  <!-- ============ LEFT: broken ============ -->
  <rect x="60" y="110" width="520" height="420" rx="14" fill="#15213a" stroke="#f85149" stroke-opacity="0.5"/>
  <text x="84" y="140" fill="#f85149" font-size="13" font-weight="700" letter-spacing="1.2">SHARED COOKIE JAR</text>

  <rect x="90" y="162" width="190" height="54" rx="10" fill="#11203c" stroke="#2b3f66"/>
  <text x="185" y="185" text-anchor="middle" fill="#eaf0fa" font-size="13" font-weight="600">Tab A</text>
  <text x="185" y="204" text-anchor="middle" fill="#93a4c3" font-size="11.5">09:00 · 2 adults</text>

  <rect x="360" y="162" width="190" height="54" rx="10" fill="#11203c" stroke="#2b3f66"/>
  <text x="455" y="185" text-anchor="middle" fill="#eaf0fa" font-size="13" font-weight="600">Tab B</text>
  <text x="455" y="204" text-anchor="middle" fill="#93a4c3" font-size="11.5">14:00 · 1 adult</text>

  <line x1="185" y1="220" x2="290" y2="270" stroke="#f85149" stroke-width="2" marker-end="url(#iR)"/>
  <line x1="455" y1="220" x2="350" y2="270" stroke="#f85149" stroke-width="2" marker-end="url(#iR)"/>

  <rect x="200" y="278" width="240" height="50" rx="10" fill="#2a1c1c" stroke="#f85149"/>
  <text x="320" y="308" text-anchor="middle" fill="#f0857f" font-size="13.5" font-weight="700">one session cookie</text>

  <line x1="320" y1="332" x2="320" y2="376" stroke="#f85149" stroke-width="2" marker-end="url(#iR)"/>

  <rect x="170" y="384" width="300" height="60" rx="10" fill="#11203c" stroke="#f85149"/>
  <text x="320" y="410" text-anchor="middle" fill="#eaf0fa" font-size="13.5" font-weight="700">one server-side cart</text>
  <text x="320" y="430" text-anchor="middle" fill="#93a4c3" font-size="11.5">holds whatever the last tab selected</text>

  <text x="320" y="478" text-anchor="middle" fill="#f0857f" font-size="13" font-weight="600">Tab B silently overwrites Tab A.</text>
  <text x="320" y="500" text-anchor="middle" fill="#93a4c3" font-size="12.5">You reach payment holding the wrong ticket — and it looks right.</text>

  <!-- ============ RIGHT: fixed ============ -->
  <rect x="620" y="110" width="520" height="420" rx="14" fill="#15213a" stroke="#3fb950" stroke-opacity="0.5"/>
  <text x="644" y="140" fill="#3fb950" font-size="13" font-weight="700" letter-spacing="1.2">ONE JAR PER BOOKING</text>

  <rect x="650" y="162" width="190" height="54" rx="10" fill="#11203c" stroke="#2b3f66"/>
  <text x="745" y="185" text-anchor="middle" fill="#eaf0fa" font-size="13" font-weight="600">Tab A</text>
  <text x="745" y="204" text-anchor="middle" fill="#93a4c3" font-size="11.5">09:00 · 2 adults</text>

  <rect x="920" y="162" width="190" height="54" rx="10" fill="#11203c" stroke="#2b3f66"/>
  <text x="1015" y="185" text-anchor="middle" fill="#eaf0fa" font-size="13" font-weight="600">Tab B</text>
  <text x="1015" y="204" text-anchor="middle" fill="#93a4c3" font-size="11.5">14:00 · 1 adult</text>

  <line x1="745" y1="220" x2="745" y2="272" stroke="#3fb950" stroke-width="2" marker-end="url(#iG)"/>
  <line x1="1015" y1="220" x2="1015" y2="272" stroke="#3fb950" stroke-width="2" marker-end="url(#iG)"/>

  <rect x="650" y="278" width="190" height="50" rx="10" fill="#1e3326" stroke="#3fb950"/>
  <text x="745" y="308" text-anchor="middle" fill="#8fe0a6" font-size="13.5" font-weight="700">own cookie jar</text>

  <rect x="920" y="278" width="190" height="50" rx="10" fill="#1e3326" stroke="#3fb950"/>
  <text x="1015" y="308" text-anchor="middle" fill="#8fe0a6" font-size="13.5" font-weight="700">own cookie jar</text>

  <line x1="745" y1="332" x2="745" y2="376" stroke="#3fb950" stroke-width="2" marker-end="url(#iG)"/>
  <line x1="1015" y1="332" x2="1015" y2="376" stroke="#3fb950" stroke-width="2" marker-end="url(#iG)"/>

  <rect x="650" y="384" width="190" height="60" rx="10" fill="#11203c" stroke="#3fb950"/>
  <text x="745" y="410" text-anchor="middle" fill="#eaf0fa" font-size="13" font-weight="700">cart A</text>
  <text x="745" y="430" text-anchor="middle" fill="#93a4c3" font-size="11.5">09:00 · 2 adults</text>

  <rect x="920" y="384" width="190" height="60" rx="10" fill="#11203c" stroke="#3fb950"/>
  <text x="1015" y="410" text-anchor="middle" fill="#eaf0fa" font-size="13" font-weight="700">cart B</text>
  <text x="1015" y="430" text-anchor="middle" fill="#93a4c3" font-size="11.5">14:00 · 1 adult</text>

  <text x="880" y="478" text-anchor="middle" fill="#8fe0a6" font-size="13" font-weight="600">Both bookings survive to the payment page.</text>
  <text x="880" y="500" text-anchor="middle" fill="#93a4c3" font-size="12.5">Jars are reused, wiped between bookings, and cleaned up when empty.</text>

  <text x="60" y="576" fill="#6b8cc4" font-size="13">No amount of extension code can fix the left-hand case — the conflicting state is not in the browser. Only separate jars can.</text>
</svg>
