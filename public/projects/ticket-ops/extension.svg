<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <rect width="1200" height="690" fill="#0b1220"/>

  <text x="60" y="52" fill="#eaf0fa" font-size="30" font-weight="700">The extension: a small panel, a careful driver</text>
  <text x="60" y="80" fill="#93a4c3" font-size="16">Everything the operator can tune lives in one popup; everything hard lives in the content script.</text>

  <!-- ================= POPUP MOCK ================= -->
  <rect x="60" y="126" width="360" height="494" rx="14" fill="#15213a" stroke="#2b3f66"/>
  <rect x="60" y="126" width="360" height="40" rx="14" fill="#16284a"/>
  <rect x="60" y="152" width="360" height="14" fill="#16284a"/>
  <line x1="60" y1="166" x2="420" y2="166" stroke="#2b3f66"/>
  <text x="84" y="152" fill="#eaf0fa" font-size="14" font-weight="700">Booking Assistant</text>
  <rect x="330" y="138" width="68" height="20" rx="10" fill="#1e3326" stroke="#3fb950"/>
  <text x="364" y="152" text-anchor="middle" fill="#8fe0a6" font-size="11" font-weight="700">unlocked</text>

  <text x="84" y="192" fill="#6b8cc4" font-size="10.5" font-weight="700" letter-spacing="1.2">CONTACT PROFILE</text>

  <g font-size="11.5">
    <rect x="84" y="202" width="140" height="28" rx="6" fill="#11203c" stroke="#2b3f66"/><text x="96" y="220" fill="#c9d6ea">First name</text>
    <rect x="236" y="202" width="140" height="28" rx="6" fill="#11203c" stroke="#2b3f66"/><text x="248" y="220" fill="#c9d6ea">Surname</text>
    <rect x="84" y="238" width="292" height="28" rx="6" fill="#11203c" stroke="#2b3f66"/><text x="96" y="256" fill="#c9d6ea">Email</text>
    <rect x="84" y="274" width="140" height="28" rx="6" fill="#11203c" stroke="#2b3f66"/><text x="96" y="292" fill="#c9d6ea">Country</text>
    <rect x="236" y="274" width="140" height="28" rx="6" fill="#11203c" stroke="#2b3f66"/><text x="248" y="292" fill="#c9d6ea">City</text>
  </g>
  <text x="84" y="322" fill="#6b8cc4" font-size="10.5">Sheet values win per field; these fill the gaps.</text>

  <line x1="84" y1="338" x2="396" y2="338" stroke="#2b3f66"/>

  <text x="84" y="364" fill="#6b8cc4" font-size="10.5" font-weight="700" letter-spacing="1.2">BEHAVIOUR</text>

  <rect x="84" y="376" width="292" height="34" rx="8" fill="#11203c" stroke="#2b3f66"/>
  <text x="98" y="397" fill="#c9d6ea" font-size="11.5">Isolate each booking</text>
  <rect x="332" y="384" width="34" height="18" rx="9" fill="#1e3326" stroke="#3fb950"/>
  <circle cx="357" cy="393" r="6" fill="#3fb950"/>

  <rect x="84" y="418" width="292" height="34" rx="8" fill="#11203c" stroke="#2b3f66"/>
  <text x="98" y="439" fill="#c9d6ea" font-size="11.5">Checkout fill delay</text>
  <text x="362" y="439" text-anchor="end" fill="#e3b341" font-size="11.5" font-weight="700">1.5 s / field</text>

  <rect x="84" y="460" width="292" height="34" rx="8" fill="#11203c" stroke="#2b3f66"/>
  <text x="98" y="481" fill="#c9d6ea" font-size="11.5">Max booking tabs at once</text>
  <text x="362" y="481" text-anchor="end" fill="#e3b341" font-size="11.5" font-weight="700">5</text>

  <line x1="84" y1="512" x2="396" y2="512" stroke="#2b3f66"/>

  <text x="84" y="538" fill="#6b8cc4" font-size="10.5" font-weight="700" letter-spacing="1.2">AWAY MODE</text>
  <rect x="84" y="550" width="292" height="30" rx="6" fill="#11203c" stroke="#2b3f66"/>
  <text x="96" y="569" fill="#4a5a78" font-size="11">Feed link — one line per group</text>

  <rect x="84" y="588" width="292" height="34" rx="8" fill="#1e3326" stroke="#3fb950"/>
  <text x="230" y="610" text-anchor="middle" fill="#8fe0a6" font-size="12.5" font-weight="700">Autopilot is ON</text>

  <!-- ================= PIPELINE ================= -->
  <text x="460" y="112" fill="#6b8cc4" font-size="11" font-weight="700" letter-spacing="1.4">WHAT THE CONTENT SCRIPT DOES, IN ORDER</text>

  <g>
    <rect x="460" y="126" width="680" height="62" rx="10" fill="#15213a" stroke="#2b3f66"/>
    <circle cx="492" cy="157" r="15" fill="#11203c" stroke="#2b3f66"/><text x="492" y="162" text-anchor="middle" fill="#6b8cc4" font-size="12" font-weight="700">1</text>
    <text x="522" y="152" fill="#eaf0fa" font-size="14" font-weight="700">Decode the instruction out of the URL</text>
    <text x="522" y="173" fill="#93a4c3" font-size="12">Visit, date, ticket mix, target slot, language and contact details — all carried in the link itself.</text>

    <rect x="460" y="198" width="680" height="62" rx="10" fill="#15213a" stroke="#2b3f66"/>
    <circle cx="492" cy="229" r="15" fill="#11203c" stroke="#2b3f66"/><text x="492" y="234" text-anchor="middle" fill="#6b8cc4" font-size="12" font-weight="700">2</text>
    <text x="522" y="224" fill="#eaf0fa" font-size="14" font-weight="700">Find the right card by name, never by id</text>
    <text x="522" y="245" fill="#93a4c3" font-size="12">The same tolerant matcher the poller uses — shared rules, so the two can never disagree.</text>

    <rect x="460" y="270" width="680" height="62" rx="10" fill="#15213a" stroke="#2b3f66"/>
    <circle cx="492" cy="301" r="15" fill="#11203c" stroke="#2b3f66"/><text x="492" y="306" text-anchor="middle" fill="#6b8cc4" font-size="12" font-weight="700">3</text>
    <text x="522" y="296" fill="#eaf0fa" font-size="14" font-weight="700">Work the bespoke widgets, not the DOM values</text>
    <text x="522" y="317" fill="#93a4c3" font-size="12">Custom dropdowns and checkboxes only register a real click; setting a value silently changes nothing.</text>

    <rect x="460" y="342" width="680" height="62" rx="10" fill="#15213a" stroke="#2b3f66"/>
    <circle cx="492" cy="373" r="15" fill="#11203c" stroke="#2b3f66"/><text x="492" y="378" text-anchor="middle" fill="#6b8cc4" font-size="12" font-weight="700">4</text>
    <text x="522" y="368" fill="#eaf0fa" font-size="14" font-weight="700">Pick the slot in the same priority order as the alert</text>
    <text x="522" y="389" fill="#93a4c3" font-size="12">Exact requested time first, then the ±30 minute fallbacks — the same order the alert used.</text>

    <rect x="460" y="414" width="680" height="62" rx="10" fill="#15213a" stroke="#2b3f66"/>
    <circle cx="492" cy="445" r="15" fill="#11203c" stroke="#2b3f66"/><text x="492" y="450" text-anchor="middle" fill="#6b8cc4" font-size="12" font-weight="700">5</text>
    <text x="522" y="440" fill="#eaf0fa" font-size="14" font-weight="700">Re-arm on every in-app route change</text>
    <text x="522" y="461" fill="#93a4c3" font-size="12">Nothing reloads, so the history API is patched and navigation watched to re-arm each step.</text>

    <rect x="460" y="486" width="680" height="62" rx="10" fill="#15213a" stroke="#2b3f66"/>
    <circle cx="492" cy="517" r="15" fill="#11203c" stroke="#2b3f66"/><text x="492" y="522" text-anchor="middle" fill="#6b8cc4" font-size="12" font-weight="700">6</text>
    <text x="522" y="512" fill="#eaf0fa" font-size="14" font-weight="700">Fill checkout the way the framework expects</text>
    <text x="522" y="533" fill="#93a4c3" font-size="12">Focus, native setter, then input / change / blur — or the validators never see the text.</text>

    <rect x="460" y="558" width="680" height="62" rx="10" fill="#15213a" stroke="#3fb950"/>
    <circle cx="492" cy="589" r="15" fill="#1e3326" stroke="#3fb950"/><text x="492" y="594" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="700">7</text>
    <text x="522" y="584" fill="#3fb950" font-size="14" font-weight="700">Stop. Park the page at the captcha.</text>
    <text x="522" y="605" fill="#93a4c3" font-size="12">Never solved, faked or bypassed; the card is never entered. The boundary is the product.</text>
  </g>

  <text x="60" y="662" fill="#6b8cc4" font-size="13">The popup is deliberately boring. The interesting engineering is all in step 3 and step 5 — the two places a naive automation quietly fails.</text>
</svg>
