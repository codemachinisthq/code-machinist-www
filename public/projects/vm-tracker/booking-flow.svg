<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="d" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b7bb5"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#0b1220"/>

  <text x="60" y="56" fill="#eaf0fa" font-size="30" font-weight="700">End-to-End Booking Flow</text>
  <text x="60" y="84" fill="#93a4c3" font-size="16">From "a wanted slot opens" to "one tap from paying" — in seconds.</text>

  <!-- vertical rail -->
  <line x1="120" y1="120" x2="120" y2="628" stroke="#2b3f66" stroke-width="3"/>

  <!-- lane labels -->
  <rect x="150" y="116" width="90" height="22" rx="11" fill="#16284a" stroke="#2b3f66"/>
  <text x="195" y="131" text-anchor="middle" fill="#7fa0d8" font-size="12" font-weight="700">SERVER</text>

  <!-- step template: dot at x=120, card x=160 w=940 h=52 -->
  <!-- 1 -->
  <circle cx="120" cy="170" r="11" fill="#2563eb"/>
  <text x="120" y="175" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">1</text>
  <rect x="160" y="146" width="960" height="50" rx="10" fill="#15213a" stroke="#2b3f66"/>
  <text x="180" y="170" fill="#eaf0fa" font-size="16" font-weight="600">Bot detects an open slot</text>
  <text x="180" y="188" fill="#93a4c3" font-size="12.5">polls the site's internal API on an interval, matches a watch-row's date / time / visit type</text>

  <!-- 2 -->
  <circle cx="120" cy="234" r="11" fill="#2563eb"/>
  <text x="120" y="239" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">2</text>
  <rect x="160" y="210" width="960" height="50" rx="10" fill="#15213a" stroke="#2b3f66"/>
  <text x="180" y="234" fill="#eaf0fa" font-size="16" font-weight="600">Telegram alert sent</text>
  <text x="180" y="252" fill="#93a4c3" font-size="12.5">formatted message + a deep link encoding the full booking instruction (tickets, time, contact)</text>

  <rect x="150" y="280" width="100" height="22" rx="11" fill="#2e2410" stroke="#5a4416"/>
  <text x="200" y="295" text-anchor="middle" fill="#e3b341" font-size="12" font-weight="700">EXTENSION</text>

  <!-- 3 -->
  <circle cx="120" cy="330" r="11" fill="#94a3b8"/>
  <text x="120" y="335" text-anchor="middle" fill="#0b1220" font-size="13" font-weight="700">3</text>
  <rect x="160" y="306" width="960" height="50" rx="10" fill="#15213a" stroke="#2b3f66"/>
  <text x="180" y="330" fill="#eaf0fa" font-size="16" font-weight="600">User taps "Auto-fill &amp; Book"</text>
  <text x="180" y="348" fill="#93a4c3" font-size="12.5">opens in a Chromium browser with the extension; it decodes the link</text>

  <!-- 4 -->
  <circle cx="120" cy="394" r="11" fill="#e3b341"/>
  <text x="120" y="399" text-anchor="middle" fill="#0b1220" font-size="13" font-weight="700">4</text>
  <rect x="160" y="370" width="960" height="50" rx="10" fill="#1b2742" stroke="#3a4d77"/>
  <text x="180" y="394" fill="#eaf0fa" font-size="16" font-weight="600">Selects the visit &amp; clicks BOOK</text>
  <text x="180" y="412" fill="#93a4c3" font-size="12.5">bilingual fuzzy name match finds the right card (EN/IT, wording-tolerant)</text>

  <!-- 5 -->
  <circle cx="120" cy="458" r="11" fill="#e3b341"/>
  <text x="120" y="463" text-anchor="middle" fill="#0b1220" font-size="13" font-weight="700">5</text>
  <rect x="160" y="434" width="960" height="50" rx="10" fill="#1b2742" stroke="#3a4d77"/>
  <text x="180" y="458" fill="#eaf0fa" font-size="16" font-weight="600">Sets ticket counts &amp; time slot</text>
  <text x="180" y="476" fill="#93a4c3" font-size="12.5">adult → full, child → reduced; picks the closest free slot within ±30 min of the preferred time</text>

  <!-- 6 -->
  <circle cx="120" cy="522" r="11" fill="#e3b341"/>
  <text x="120" y="527" text-anchor="middle" fill="#0b1220" font-size="13" font-weight="700">6</text>
  <rect x="160" y="498" width="960" height="50" rx="10" fill="#1b2742" stroke="#3a4d77"/>
  <text x="180" y="522" fill="#eaf0fa" font-size="16" font-weight="600">Prefills the checkout form</text>
  <text x="180" y="540" fill="#93a4c3" font-size="12.5">name, surname, sex, country, city, birth date, email, phone + participants + terms — then stops</text>

  <rect x="150" y="568" width="80" height="22" rx="11" fill="#13301f" stroke="#2f7d54"/>
  <text x="190" y="583" text-anchor="middle" fill="#9be8bf" font-size="12" font-weight="700">HUMAN</text>

  <!-- 7 -->
  <circle cx="120" cy="618" r="11" fill="#2f9e63"/>
  <text x="120" y="623" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">7</text>
  <rect x="160" y="594" width="960" height="50" rx="10" fill="#13301f" stroke="#2f7d54"/>
  <text x="180" y="618" fill="#9be8bf" font-size="16" font-weight="600">Human solves captcha &amp; pays</text>
  <text x="180" y="636" fill="#bfe9d2" font-size="12.5">Cloudflare Turnstile + card / 3-D Secure stay manual by design — never bypassed or auto-paid</text>
</svg>
