<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <rect width="1200" height="675" fill="#0b1220"/>
  <text x="60" y="56" fill="#eaf0fa" font-size="30" font-weight="700">Before vs After</text>
  <text x="60" y="84" fill="#93a4c3" font-size="16">The same booking — manual checkout vs the auto-fill assistant.</text>

  <!-- BEFORE panel -->
  <rect x="60" y="108" width="510" height="520" rx="16" fill="#160f12" stroke="#5a2f2a"/>
  <text x="86" y="146" fill="#e0734f" font-size="18" font-weight="700">BEFORE — manual</text>
  <text x="86" y="170" fill="#caa39a" font-size="13">do all of this yourself, under a countdown</text>

  <g font-size="14.5">
    <!-- rows -->
    <g>
      <rect x="86" y="186" width="458" height="46" rx="9" fill="#1d1416" stroke="#4a282454"/>
      <circle cx="112" cy="209" r="12" fill="#e0734f"/><text x="112" y="214" text-anchor="middle" fill="#160f12" font-size="13" font-weight="700">1</text>
      <text x="136" y="214" fill="#e9d7d2">Refresh &amp; watch for availability</text>
    </g>
    <g>
      <rect x="86" y="240" width="458" height="46" rx="9" fill="#1d1416" stroke="#4a282454"/>
      <circle cx="112" cy="263" r="12" fill="#e0734f"/><text x="112" y="268" text-anchor="middle" fill="#160f12" font-size="13" font-weight="700">2</text>
      <text x="136" y="268" fill="#e9d7d2">Pick the visit type</text>
    </g>
    <g>
      <rect x="86" y="294" width="458" height="46" rx="9" fill="#1d1416" stroke="#4a282454"/>
      <circle cx="112" cy="317" r="12" fill="#e0734f"/><text x="112" y="322" text-anchor="middle" fill="#160f12" font-size="13" font-weight="700">3</text>
      <text x="136" y="322" fill="#e9d7d2">Choose adult / child ticket counts</text>
    </g>
    <g>
      <rect x="86" y="348" width="458" height="46" rx="9" fill="#1d1416" stroke="#4a282454"/>
      <circle cx="112" cy="371" r="12" fill="#e0734f"/><text x="112" y="376" text-anchor="middle" fill="#160f12" font-size="13" font-weight="700">4</text>
      <text x="136" y="376" fill="#e9d7d2">Find a free time slot before it's gone</text>
    </g>
    <g>
      <rect x="86" y="402" width="458" height="46" rx="9" fill="#1d1416" stroke="#4a282454"/>
      <circle cx="112" cy="425" r="12" fill="#e0734f"/><text x="112" y="430" text-anchor="middle" fill="#160f12" font-size="13" font-weight="700">5</text>
      <text x="136" y="430" fill="#e9d7d2">Type a 10-field contact form</text>
    </g>
    <g>
      <rect x="86" y="456" width="458" height="46" rx="9" fill="#1d1416" stroke="#4a282454"/>
      <circle cx="112" cy="479" r="12" fill="#e0734f"/><text x="112" y="484" text-anchor="middle" fill="#160f12" font-size="13" font-weight="700">6</text>
      <text x="136" y="484" fill="#e9d7d2">Solve captcha &amp; pay</text>
    </g>
  </g>
  <text x="86" y="560" fill="#e0734f" font-size="20" font-weight="700">⏱ minutes</text>
  <text x="86" y="586" fill="#caa39a" font-size="13">often sold out before you finish typing</text>

  <!-- VS -->
  <circle cx="595" cy="368" r="30" fill="#0b1220" stroke="#3a4d77" stroke-width="2"/>
  <text x="595" y="376" text-anchor="middle" fill="#93a4c3" font-size="18" font-weight="700">vs</text>

  <!-- AFTER panel -->
  <rect x="630" y="108" width="510" height="520" rx="16" fill="#0e1f15" stroke="#2f7d54"/>
  <text x="656" y="146" fill="#7ee0a6" font-size="18" font-weight="700">AFTER — with the assistant</text>
  <text x="656" y="170" fill="#9fcbb2" font-size="13">one tap; the rest is prefilled for you</text>

  <g font-size="14.5">
    <rect x="656" y="186" width="458" height="46" rx="9" fill="#102a1c" stroke="#235f3f"/>
    <circle cx="682" cy="209" r="12" fill="#2f9e63"/><text x="682" y="214" text-anchor="middle" fill="#0e1f15" font-size="13" font-weight="700">1</text>
    <text x="706" y="214" fill="#d6efe0">Tap the Telegram alert link</text>

    <!-- auto block -->
    <rect x="656" y="246" width="458" height="170" rx="11" fill="#13301f" stroke="#2f7d54"/>
    <text x="676" y="274" fill="#e3b341" font-size="14" font-weight="700">⚡ Auto-filled by the extension</text>
    <text x="676" y="302" fill="#cdebd9" font-size="13.5">• selects the right visit + clicks Book</text>
    <text x="676" y="326" fill="#cdebd9" font-size="13.5">• sets adult / child ticket counts</text>
    <text x="676" y="350" fill="#cdebd9" font-size="13.5">• picks the time slot (±30 min)</text>
    <text x="676" y="374" fill="#cdebd9" font-size="13.5">• prefills the 10-field contact form</text>
    <text x="676" y="398" fill="#9fcbb2" font-size="12" font-style="italic">no typing, no hunting</text>

    <rect x="656" y="430" width="458" height="46" rx="9" fill="#102a1c" stroke="#235f3f"/>
    <circle cx="682" cy="453" r="12" fill="#2f9e63"/><text x="682" y="458" text-anchor="middle" fill="#0e1f15" font-size="13" font-weight="700">2</text>
    <text x="706" y="458" fill="#d6efe0">Solve captcha &amp; pay  (human, by design)</text>
  </g>
  <text x="656" y="560" fill="#7ee0a6" font-size="20" font-weight="700">⏱ seconds</text>
  <text x="656" y="586" fill="#9fcbb2" font-size="13">land one tap from paying, while slots are still live</text>
</svg>
