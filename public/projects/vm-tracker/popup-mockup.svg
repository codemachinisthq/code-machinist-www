<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="#0b1220"/>

  <!-- faux browser toolbar -->
  <rect x="0" y="0" width="1200" height="48" fill="#0f1830"/>
  <line x1="0" y1="48" x2="1200" y2="48" stroke="#22304f"/>
  <circle cx="26" cy="24" r="6" fill="#3b4a6b"/><circle cx="48" cy="24" r="6" fill="#3b4a6b"/><circle cx="70" cy="24" r="6" fill="#3b4a6b"/>
  <rect x="110" y="13" width="820" height="22" rx="11" fill="#16223c"/>
  <text x="128" y="29" fill="#5f739c" font-size="13">official ticketing site — booking page</text>
  <!-- extension icon -->
  <rect x="1086" y="11" width="26" height="26" rx="7" fill="#1b2742" stroke="#2b3f66"/>
  <rect x="1093" y="18" width="12" height="12" rx="3" fill="#e3b341"/>

  <text x="60" y="92" fill="#eaf0fa" font-size="26" font-weight="700">Extension popup</text>
  <text x="60" y="118" fill="#93a4c3" font-size="15">Contact details saved locally on the user's device — used to prefill the checkout.</text>

  <!-- pointer from icon to card -->
  <path d="M1099 40 L1090 66 L1108 66 Z" fill="#ffffff"/>

  <!-- popup card -->
  <g filter="url(#shadow)">
    <rect x="740" y="64" width="400" height="566" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  </g>

  <!-- header -->
  <rect x="760" y="90" width="18" height="18" rx="4" fill="#e0a800"/>
  <text x="786" y="105" fill="#0f172a" font-size="17" font-weight="700">Ticket Auto-Fill</text>
  <text x="760" y="132" fill="#64748b" font-size="12.5">Used to prefill the checkout contact form.</text>
  <text x="760" y="150" fill="#64748b" font-size="12.5">Stored only on this device.</text>

  <!-- Row A: Name / Surname -->
  <text x="760" y="180" fill="#64748b" font-size="12">Name</text>
  <rect x="760" y="186" width="170" height="34" rx="7" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="774" y="208" fill="#0f172a" font-size="14">Alex</text>
  <text x="950" y="180" fill="#64748b" font-size="12">Surname</text>
  <rect x="950" y="186" width="170" height="34" rx="7" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="964" y="208" fill="#0f172a" font-size="14">Taylor</text>

  <!-- Email -->
  <text x="760" y="244" fill="#64748b" font-size="12">Email</text>
  <rect x="760" y="250" width="360" height="34" rx="7" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="774" y="272" fill="#0f172a" font-size="14">alex.taylor@email.com</text>

  <!-- Row B: Mobile / Birth date -->
  <text x="760" y="308" fill="#64748b" font-size="12">Mobile number</text>
  <rect x="760" y="314" width="170" height="34" rx="7" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="774" y="336" fill="#0f172a" font-size="14">+1 555 0134</text>
  <text x="950" y="308" fill="#64748b" font-size="12">Birth date</text>
  <rect x="950" y="314" width="170" height="34" rx="7" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="964" y="336" fill="#0f172a" font-size="14">04/11/1990</text>

  <!-- Row C: Sex / City -->
  <text x="760" y="372" fill="#64748b" font-size="12">Sex</text>
  <rect x="760" y="378" width="170" height="34" rx="7" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="774" y="400" fill="#0f172a" font-size="14">Male</text>
  <path d="M906 392 l8 0 l-4 6 z" fill="#64748b"/>
  <text x="950" y="372" fill="#64748b" font-size="12">City</text>
  <rect x="950" y="378" width="170" height="34" rx="7" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="964" y="400" fill="#0f172a" font-size="14">London</text>

  <!-- Row D: Nation / Language -->
  <text x="760" y="436" fill="#64748b" font-size="12">Nation</text>
  <rect x="760" y="442" width="170" height="34" rx="7" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="774" y="464" fill="#0f172a" font-size="14">United Kingdom</text>
  <path d="M906 456 l8 0 l-4 6 z" fill="#64748b"/>
  <text x="950" y="436" fill="#64748b" font-size="12">Language</text>
  <rect x="950" y="442" width="170" height="34" rx="7" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="964" y="464" fill="#0f172a" font-size="14">English</text>
  <path d="M1096 456 l8 0 l-4 6 z" fill="#64748b"/>

  <!-- Save button -->
  <rect x="760" y="502" width="360" height="44" rx="9" fill="#e0a800"/>
  <text x="940" y="529" text-anchor="middle" fill="#1a1300" font-size="15" font-weight="700">Save details</text>

  <text x="940" y="576" text-anchor="middle" fill="#1a7f37" font-size="12.5">Saved ✓ — stays on this device, never sent anywhere</text>
</svg>
