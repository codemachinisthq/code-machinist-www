<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b8cc4"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e3b341"/>
    </marker>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16284a"/><stop offset="1" stop-color="#11203c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="#0b1220"/>

  <!-- title -->
  <text x="60" y="58" fill="#eaf0fa" font-size="30" font-weight="700">Ticket Tracker &amp; Auto-Fill — System Architecture</text>
  <text x="60" y="86" fill="#93a4c3" font-size="16">A server-side tracker bot + a client-side auto-fill browser extension, bridged by a deep link.</text>

  <!-- external system band -->
  <rect x="60" y="118" width="1080" height="78" rx="12" fill="url(#band)" stroke="#2b3f66"/>
  <text x="84" y="150" fill="#e3b341" font-size="17" font-weight="700">Official ticketing site (target)</text>
  <text x="84" y="174" fill="#aebcd2" font-size="14">Angular SPA · undocumented internal JSON API · Cloudflare Turnstile · external bank gateway</text>

  <!-- pipeline cards y=320 -->
  <!-- card geometry: w=165 h=120, x = 45 + i*189 -->
  <g>
    <!-- 0 Sheet -->
    <rect x="45" y="320" width="165" height="120" rx="12" fill="#15213a" stroke="#2b3f66"/>
    <text x="127" y="356" text-anchor="middle" fill="#eaf0fa" font-size="16" font-weight="700">Google Sheet</text>
    <text x="127" y="384" text-anchor="middle" fill="#93a4c3" font-size="12">watch rows:</text>
    <text x="127" y="402" text-anchor="middle" fill="#93a4c3" font-size="12">date · time · tickets</text>
    <text x="127" y="420" text-anchor="middle" fill="#93a4c3" font-size="12">contact · visit type</text>

    <!-- 1 Bot -->
    <rect x="234" y="320" width="165" height="120" rx="12" fill="#15213a" stroke="#2b3f66"/>
    <text x="316" y="356" text-anchor="middle" fill="#eaf0fa" font-size="16" font-weight="700">Tracker Bot</text>
    <text x="316" y="378" text-anchor="middle" fill="#93a4c3" font-size="12">Node.js · Docker</text>
    <text x="316" y="398" text-anchor="middle" fill="#93a4c3" font-size="12">polls API,</text>
    <text x="316" y="416" text-anchor="middle" fill="#93a4c3" font-size="12">matches slots</text>

    <!-- 2 Telegram -->
    <rect x="423" y="320" width="165" height="120" rx="12" fill="#15213a" stroke="#2b3f66"/>
    <text x="505" y="356" text-anchor="middle" fill="#eaf0fa" font-size="16" font-weight="700">Telegram</text>
    <text x="505" y="384" text-anchor="middle" fill="#93a4c3" font-size="12">instant alert</text>
    <text x="505" y="402" text-anchor="middle" fill="#93a4c3" font-size="12">with a deep link</text>
    <text x="505" y="420" text-anchor="middle" fill="#93a4c3" font-size="12">(booking data)</text>

    <!-- 3 Extension -->
    <rect x="612" y="320" width="165" height="120" rx="12" fill="#15213a" stroke="#2b3f66"/>
    <text x="694" y="356" text-anchor="middle" fill="#eaf0fa" font-size="16" font-weight="700">Extension</text>
    <text x="694" y="378" text-anchor="middle" fill="#93a4c3" font-size="12">WXT · React</text>
    <text x="694" y="398" text-anchor="middle" fill="#93a4c3" font-size="12">decodes link,</text>
    <text x="694" y="416" text-anchor="middle" fill="#93a4c3" font-size="12">drives the UI</text>

    <!-- 4 Checkout -->
    <rect x="801" y="320" width="165" height="120" rx="12" fill="#15213a" stroke="#2b3f66"/>
    <text x="883" y="356" text-anchor="middle" fill="#eaf0fa" font-size="16" font-weight="700">Prefilled</text>
    <text x="883" y="376" text-anchor="middle" fill="#eaf0fa" font-size="16" font-weight="700">Checkout</text>
    <text x="883" y="400" text-anchor="middle" fill="#93a4c3" font-size="12">tickets · slot ·</text>
    <text x="883" y="418" text-anchor="middle" fill="#93a4c3" font-size="12">contact form</text>

    <!-- 5 Human -->
    <rect x="990" y="320" width="165" height="120" rx="12" fill="#13301f" stroke="#2f7d54"/>
    <text x="1072" y="356" text-anchor="middle" fill="#9be8bf" font-size="16" font-weight="700">Human</text>
    <text x="1072" y="384" text-anchor="middle" fill="#bfe9d2" font-size="12">solves captcha</text>
    <text x="1072" y="402" text-anchor="middle" fill="#bfe9d2" font-size="12">+ pays</text>
    <text x="1072" y="424" text-anchor="middle" fill="#6fbf95" font-size="11" font-style="italic">always manual</text>
  </g>

  <!-- horizontal arrows between cards (y=380) -->
  <g stroke="#6b8cc4" stroke-width="2.5" fill="none">
    <line x1="210" y1="380" x2="232" y2="380" marker-end="url(#arr)"/>
    <line x1="399" y1="380" x2="421" y2="380" marker-end="url(#arr)"/>
    <line x1="588" y1="380" x2="610" y2="380" marker-end="url(#arr)"/>
    <line x1="777" y1="380" x2="799" y2="380" marker-end="url(#arr)"/>
  </g>
  <g stroke="#e3b341" stroke-width="2.5" fill="none">
    <line x1="966" y1="380" x2="988" y2="380" marker-end="url(#arrG)"/>
  </g>

  <!-- dashed links to external band -->
  <g stroke="#6b8cc4" stroke-width="2" stroke-dasharray="6 5" fill="none">
    <line x1="316" y1="320" x2="316" y2="198" marker-end="url(#arr)"/>
    <line x1="694" y1="320" x2="694" y2="198" marker-end="url(#arr)"/>
  </g>
  <text x="326" y="250" fill="#93a4c3" font-size="12">poll availability</text>
  <text x="704" y="250" fill="#93a4c3" font-size="12">drive booking UI</text>

  <!-- arrow labels -->
  <text x="221" y="372" fill="#7e95bd" font-size="11">read</text>
  <text x="402" y="372" fill="#7e95bd" font-size="11">alert</text>
  <text x="585" y="372" fill="#7e95bd" font-size="11">click</text>
  <text x="772" y="372" fill="#7e95bd" font-size="11">fill</text>

  <!-- footer note -->
  <text x="60" y="520" fill="#93a4c3" font-size="14">Design principle: automate the tedious 90% — selection, ticket counts, slot pick, and the contact form —</text>
  <text x="60" y="542" fill="#93a4c3" font-size="14">while the captcha and the actual payment stay in human hands. No captcha bypass, no unattended payment.</text>

  <text x="60" y="600" fill="#56688c" font-size="12">Node.js · Google Sheets API · Telegram Bot API · Docker · WXT · TypeScript · React</text>
</svg>
